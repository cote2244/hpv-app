<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบประเมินความเสี่ยงมะเร็งปากมดลูก</title>
    <style>
        body { font-family: sans-serif; background-color: #f9f9f9; margin: 0; padding: 0; }
        .container { max-width: 400px; margin: 0 auto; background: white; min-height: 100vh; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .banner { width: 100%; display: block; }
        .content { padding: 20px; }
        h2 { color: #d06d86; text-align: center; }
        .input-group { margin-bottom: 15px; }
        input[type="text"] { width: 100%; padding: 12px; border: 2px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #f5a6b8; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; background-color: #f0f8ff; border: 1px solid #cce7ff; }
        .risk-level { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        ul { padding-left: 20px; }
        li { margin-bottom: 8px; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="container">
        <img src="HPV.jpg" alt="แบนเนอร์" class="banner">
        
        <div class="content">
            <h2>ตรวจสอบผลประเมิน</h2>
            <div class="input-group">
                <input type="text" id="patientCode" placeholder="กรอกรหัสประเมินของคุณ">
            </div>
            <button onclick="checkResult()">ตรวจสอบผล</button>

            <div id="resultContainer" class="result-box">
                <div id="riskLevel" class="risk-level"></div>
                <p><strong>ข้อความแจ้งผล:</strong> <span id="resultMessage"></span></p>
                <p><strong>คำแนะนำ:</strong></p>
                <ul id="adviceList"></ul>
            </div>
        </div>
    </div>

    <script>
        async function checkResult() {
            const code = document.getElementById('patientCode').value.trim();
            const resultBox = document.getElementById('resultContainer');
            
            if(!code) {
                alert("กรุณากรอกรหัสประเมิน");
                return;
            }

            try {
                const response = await fetch(`https://hpv-app.onrender.com/check-hpv/${code}`);
                
                if(!response.ok) {
                    alert("ไม่พบรหัสประเมินนี้ในระบบ");
                    resultBox.style.display = "none";
                    return;
                }

                const data = await response.json();
                
                document.getElementById('riskLevel').innerText = `ระดับความเสี่ยง: ${data.risk_level}`;
                document.getElementById('resultMessage').innerText = data.message;
                
                const ul = document.getElementById('adviceList');
                ul.innerHTML = ""; 
                data.advice.forEach(item => {
                    let li = document.createElement("li");
                    li.innerText = item;
                    ul.appendChild(li);
                });

                resultBox.style.display = "block"; 

            } catch (error) {
                alert("กรุณาเปิดระบบ Backend ก่อนทำการทดสอบ");
            }
        }
    </script>
</body>
</html>
